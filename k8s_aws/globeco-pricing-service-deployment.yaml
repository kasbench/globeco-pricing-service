apiVersion: apps/v1
kind: Deployment
metadata:
  name: globeco-pricing-service
  namespace: globeco
spec:
  {{- if eq .Values.autoscaler "vpa" }}
  replicas: 2
  {{- else }}
  replicas: 1
  {{- end }}

  # A newly-ready pod must remain ready for 10 seconds before
  # the Deployment considers it available.
  minReadySeconds: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: globeco-pricing-service
  template:
    metadata:
      labels:
        app: globeco-pricing-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h globeco-pricing-service-postgresql -p 5432; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready."
      containers:
        - name: globeco-pricing-service
          image: kasbench/globeco-pricing-service:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            # Inject the node and pod metadata from the Downward API
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace  

            # Inject the node IP from the Downward API
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            
            - name: OTLP_METRICS_ENDPOINT
              value: "http://$(NODE_IP):4318/v1/metrics"
            - name: OTLP_TRACING_ENDPOINT
              value: "http://$(NODE_IP):4318/v1/traces"

            # Define standard service identity attributes
            - name: OTEL_SERVICE_NAME
              value: "globeco-pricing-service"  # Changed to match container name
            - name: OTEL_SERVICE_NAMESPACE
              value: "globeco"
            
            # Inject Kubernetes metadata as resource attributes for k8sattributes processor
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: >-
                k8s.pod.ip=$(MY_POD_IP),
                k8s.pod.name=$(MY_POD_NAME),
                k8s.node.name=$(MY_NODE_NAME),
                k8s.namespace.name=$(MY_NAMESPACE)
            # - name: OTEL_RESOURCE_ATTRIBUTES
            #   value: "k8s.pod.ip=$(MY_POD_IP),k8s.pod.name=$(MY_POD_NAME),k8s.node.name=$(MY_NODE_NAME),k8s.namespace.name=$(MY_NAMESPACE)"
            - name: k8s_pod_ip
              value: $(MY_POD_IP)
            - name: k8s_pod_name
              value: $(MY_POD_NAME)
            - name: k8s_node_name
              value: $(MY_NODE_NAME)
            - name: k8s_namespace_name
              value: $(MY_NAMESPACE)
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer

          resources:
            requests:
              cpu: 1000m
              memory: 800Mi
            limits:
              cpu: 1000m
              memory: 800Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 40
---
apiVersion: v1
kind: Service
metadata:
  name: globeco-pricing-service
  namespace: globeco
spec:
  selector:
    app: globeco-pricing-service
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP
{{- if eq .Values.autoscaler "vpa" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: globeco-pricing-service-pdb
  namespace: globeco

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: globeco-pricing-service
{{- end }}